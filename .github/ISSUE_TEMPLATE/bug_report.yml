name: Bug report
description: Something in ClAudit is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python3 claudit_scan.py --doctor`
      description: Paste it as is. It has no secrets in it.
      render: shell
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or mode
      placeholder: "claudit_scan.py --watch --auto  /  claudit_gui.py"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback or stderr
      description: Scrub anything sensitive first.
      render: shell
