name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile (catches syntax errors)
        run: python -m py_compile claudit.py claudit_scan.py claudit_gui.py scripts/gen-icon.py scripts/render_poll.py scripts/pattern_report.py
      - name: Install dev deps
        run: pip install ruff pytest
      - name: Ruff
        run: ruff check .   # the ruleset lives in pyproject.toml
      - name: Tests
        run: python -m pytest tests/ -q

  gui-smoke:
    # Import the tray app and build its dialogs offscreen on each desktop OS. Not a substitute for
    # a person watching the tray icon (issue #1), but it catches import errors and Qt API breakage.
    name: gui smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install PyQt6 pytest
      - name: Offscreen GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui_smoke.py -q

  package:
    name: package (wheel + entry points)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
          ls -l dist/
      - name: Install the wheel and smoke-test the console scripts
        run: |
          pip install dist/*.whl
          claudit-watch --version
          claudit-watch --help > /dev/null
          claudit --help > /dev/null
      - name: Version line matches __version__
        run: |
          v=$(python -c "import claudit_scan; print(claudit_scan.__version__)")
          grep -q "^Current version: $v\." README.md || { echo "::error::README does not say 'Current version: $v.'"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$v] section"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
