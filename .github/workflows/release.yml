# Tag-driven release: push a tag like v2.3.0 and this builds the sdist + wheel, pulls that
# version's CHANGELOG section for the notes, publishes a GitHub Release with the files attached,
# and then uploads the same files to PyPI as `claudit-cc` through Trusted Publishing (OIDC, no
# token to store). A release created with GITHUB_TOKEN cannot trigger a separate workflow, which is
# why the PyPI step lives here rather than in its own `on: release` file.
#
# One-time PyPI setup (the only step that needs an account): pypi.org -> Your projects ->
# Publishing -> "Add a new pending publisher": project claudit-cc, owner sworrl, repository
# ClAudit, workflow release.yml, environment pypi. Until it exists the publish job fails and is
# marked continue-on-error, so the GitHub Release itself is unaffected.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        run: |
          v=$(python -c "import claudit_scan; print(claudit_scan.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but __version__ is $v"; exit 1; }
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the section for this version: from its "## [v]" heading up to the next "## " heading
          awk -v v="$v" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          printf '\n---\nInstall: `pip install "claudit-cc[gui] @ https://github.com/sworrl/ClAudit/archive/refs/tags/%s.tar.gz"` or download the wheel below.\n' "${GITHUB_REF_NAME}" >> notes.md
          cat notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ClAudit ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag

  pypi:
    name: publish to PyPI (claudit-cc)
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    continue-on-error: true      # until the pending publisher is registered on pypi.org
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
